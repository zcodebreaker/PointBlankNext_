spring:
  application:
    name: pointblank-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/PointBlankNextGen}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    url: ${FLYWAY_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/PointBlankNextGen}}
    user: ${FLYWAY_DB_USERNAME:${DB_USERNAME}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD}}
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
    default-schema: public
    schemas: public
    validate-migration-naming: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
            required: ${SMTP_STARTTLS_REQUIRED:true}
          ssl:
            enable: ${SMTP_SSL_ENABLE:false}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${SMTP_TIMEOUT:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT:5000}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    issuer: ${APP_JWT_ISSUER:pointblank-api}
    access-token-ttl: ${APP_JWT_ACCESS_TTL:PT2H}
    remember-token-ttl: ${APP_JWT_REMEMBER_TTL:P30D}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  email-verification:
    public-url: ${APP_PUBLIC_URL:http://localhost:3000}
    from-address: ${APP_MAIL_FROM:noreply@kryonixnetwork.com}
    token-ttl: ${APP_EMAIL_VERIFICATION_TTL:PT24H}
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY}
    siteverify-url: ${TURNSTILE_SITEVERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
    allowed-hostnames: ${TURNSTILE_ALLOWED_HOSTNAMES}
